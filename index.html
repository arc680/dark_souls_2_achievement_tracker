<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ダークソウル2 トロコン帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one column ledger — header with progress, tab strip, grouped rows with grade seal + checkbox */
:root{
  --bg:#e6e8ea; --panel:#f3f4f5; --line:#c9cdd2; --fg:#1d2228; --muted:#5d6670;
  --ember:#9a5b14; --ember-soft:#f0dcc0; --done:#3e6b4f;
  --plat:#6f7f93; --gold:#a8801c; --silver:#7d858e; --bronze:#94603a;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171c; --panel:#1c2027; --line:#2e343d; --fg:#e4e1da; --muted:#959ba3;
  --ember:#e0a04a; --ember-soft:#3a2a17; --done:#7fb08f;
  --plat:#a9b8cb; --gold:#d8ae45; --silver:#b4bbc3; --bronze:#c58a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1c2027; --line:#2e343d; --fg:#e4e1da; --muted:#959ba3;
  --ember:#e0a04a; --ember-soft:#3a2a17; --done:#7fb08f;
  --plat:#a9b8cb; --gold:#d8ae45; --silver:#b4bbc3; --bronze:#c58a5c; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
header{display:grid;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.15;margin:0;text-wrap:balance}
h1 span{color:var(--ember)}
.meter{display:grid;gap:6px}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.meter-big{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.meter-big small{font-size:14px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ember);transition:width .3s}
.save{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tab{flex:0 0 auto;border:0;background:none;color:var(--muted);font:500 14px var(--body);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.tab b{font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ember)}
.tab:focus-visible,.chk:focus-visible,.toggle input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.tools{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.toggle{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.note{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.note strong{color:var(--fg)}
.group{display:grid;gap:0}
.group h2{font-family:var(--display);font-weight:600;font-size:17px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.group h2 span{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:1px solid var(--line)}
.row .txt{min-width:0}
.name{font-weight:700}
.desc{font-size:13px;color:var(--muted)}
.tip{font-size:12.5px;color:var(--fg);opacity:.8;margin-top:2px}
.row.on .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--done)}
.row.dlc .name::after{content:"DLC";font:500 10.5px var(--body);letter-spacing:.06em;margin-left:8px;padding:1px 6px;border:1px solid var(--line);border-radius:3px;color:var(--muted);vertical-align:2px}
.chk{appearance:none;width:22px;height:22px;margin:2px 0 0;border:1.5px solid var(--muted);border-radius:4px;display:grid;place-items:center;cursor:pointer;background:var(--panel)}
.chk:checked{background:var(--done);border-color:var(--done)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid var(--panel);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.seal{font:500 11px var(--body);letter-spacing:.05em;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;margin-top:2px}
.g-P{color:var(--plat)}.g-G{color:var(--gold)}.g-S{color:var(--silver)}.g-B{color:var(--bronze)}
.chip{color:var(--ember);max-width:9.5em;white-space:normal;text-align:center;line-height:1.35}
.lead{margin:0 0 8px;font-size:13.5px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:10px}
.card h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0}
.card p{margin:0;font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px 14px}
.stats div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding-bottom:2px;font-size:13.5px}
.stats b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:420px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em}
.tbl td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
ul.tips{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:13.5px}
.empty{color:var(--muted);font-size:14px;padding:16px 0}
footer{font-size:12px;color:var(--muted);display:grid;gap:6px}
footer a{color:var(--muted)}
.reset{justify-self:start;background:none;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:4px 10px;font:12px var(--body);cursor:pointer}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.confirm button{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:4px;padding:4px 10px;font:12px var(--body);cursor:pointer}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

 ["B","2周目","四大ソウルをスペルに交換する周回。",[
  ["四大ソウルをストレイドと交換する","鉄の古王→輝かしい雷球、忘れられた罪人→炎の武器、腐れ→激しい鈍麻、公爵の娘フレイディア→ソウルの結晶槍","奇跡／呪術／闇術／魔術"],

 ["C","3周目","ベラガーの3種を買えば完了。クリアは不要。",[

const BUILD=`
<section class="card"><h3>推奨：闇術ビルド</h3>
<p>闇術は理力と信仰の<strong>低いほう</strong>で威力が決まるので、2つを同じ値でそろえて上げます。トロコンでは理力・信仰を上げる場面が多く、その振り分けがそのまま火力になります。</p>
<div class="stats"><div>生命力<b>40</b></div><div>持久力<b>20</b></div><div>体力<b>10</b></div><div>記憶力<b>30</b></div><div>筋力<b>14</b></div><div>技量<b>12</b></div><div>適応力<b>20</b></div><div>理力<b>40</b></div><div>信仰<b>40</b></div></div>
<p>理力・信仰は30を超えると伸びがゆるやかになります。まず30/30を目指し、その後は生命力と交互に上げてください。メダル稼ぎで深い沈黙を使う時期だけ、信仰を42まで上げます。</p>
<ul class="tips">
<li><strong>序盤</strong>：狩猟の森のフェルキンから闇の球を買う。取引には理力8・信仰8、闇の球を使うには理力12・信仰10が必要。</li>
<li><strong>触媒</strong>：理力20・信仰20でフェルキンがくれる杖が、闇術向きの杖の最有力。闇派生で強化する。ナヴァーランの依頼品も兼ねる。</li>
<li><strong>主力の闇術</strong>：闇の球（基本の遠距離攻撃）、闇の飛沫（集団・大型向け）、追う者たち（攻撃と防御を兼ねる）。近接武器は闇派生にして闇の武器をかける。</li>
<li><strong>ソウルを使う闇術</strong>：共鳴する武器・小さな吸精の光などは強力ですが、使うたびにソウルを消費します。理力より信仰が多く必要な闇術は、杖ではなく聖鈴で使います。</li>
<li><strong>トロコンとの相性</strong>：闇術の全種購入、闇の巡礼者のランク3（絶頂）、フェルキンの杖が、どれも闇術ビルドなら自然にそろいます。</li>
<li><strong>弱点</strong>：回復の奇跡がないので、エストと草で回復します。終盤は闇に強い敵も増えるので、物理の近接武器を1本持っておきます。</li>
</ul></section>
<section class="card"><h3>別案：筋力信仰ビルド</h3>
<p>雷派生の武器で殴りつつ、太陽の光の剣や固い誓いで補助する型です。理力は1のまま、必要な場面だけ魂の器で振り直します。</p>
<div class="stats"><div>生命力<b>50</b></div><div>持久力<b>20+</b></div><div>体力<b>11</b></div><div>記憶力<b>30</b></div><div>筋力<b>40</b></div><div>技量<b>20</b></div><div>適応力<b>30</b></div><div>理力<b>1</b></div><div>信仰<b>40</b></div></div>
<p>目安はレベル189前後。敏捷は記憶力と適応力の合計で上がり、105前後あればローリングが安定します。</p></section>
<section class="card"><h3>もっと手軽に：物理ビルド</h3>
<p>+10まで鍛えたレイピアかメイスで最後まで行けます。至高の武器のトロフィーも兼ねられます。生命力と持久力を優先し、敏捷が100前後になるまで適応力を上げます。釣り用に弓を1本持っておくと楽です。</p></section>
<section class="card"><h3>トロコンに必要なステータス</h3>
<div class="tbl"><table><thead><tr><th>場面</th><th>必要な値</th><th>メモ</th></tr></thead><tbody>
<tr><td>ストレイドと取引</td><td class="n">理力3・信仰3</td><td>交換スペルの窓口</td></tr>
<tr><td>カリオンと取引</td><td class="n">理力8</td><td>魔術の商人</td></tr>
<tr><td>フェルキンと取引</td><td class="n">理力8・信仰8</td><td>闇術・魔法防護</td></tr>
<tr><td>フェルキンから依頼品の杖</td><td class="n">理力20・信仰20</td><td>ナヴァーランの依頼に必要</td></tr>
<tr><td>深い沈黙で太陽のメダル稼ぎ</td><td class="n">記憶力16・理力20・信仰42</td><td>オフラインで効率化する場合</td></tr>
</tbody></table></div>
<p>トロフィーは「取得」が条件なので、スペルを使えるだけの能力値は要りません。足りない値は魂の器で一時的に振り直すのが早いです。</p></section>
<section class="card"><h3>周回の小技</h3>
<ul class="tips">
<li>覇者の誓約を結ぶと雑魚が消えなくなるので、ソウル稼ぎやメダル稼ぎの間だけ入る。</li>
<li>アガペの指輪を着けていると誓約の絆が上がらない。ランク上げ中は外す。</li>
<li>篝火の探究者はボスの再戦に使えるが、そのエリアは強くなる。使いどころを決めてから。</li>
<li>貪欲な銀の蛇の指輪とジェルドラ装備で、腐れなどのボス周回のソウル効率が上がる。</li>
<li>四大ソウルはオルニフェクスの武器交換と取り合いになる。トロコン中はスペルを優先。</li>
</ul></section>`;
const GE=[
 ["歓迎","マデューラの心を失くしたソダン。誓約を結んでから会話を尽くす"],
 ["開戦礼","青の聖堂の青の騎士ガラインドーク。誓約「青の守護者」を結んでから会話を尽くす"],
 ["ガッツポーズ","狩猟の森の放浪のクレイトン。牢の篝火がある部屋で話す"],
 ["歓喜","ウーゴのバンホルト。ロザベナの石化を解いた後に話す"],
 ["首斬り","虚ろの影の森のヴァンガルの首"],
 ["肩慣らし","虚ろの影の森の蠍のターク。マデューラのシャラゴアからささやきの指輪を買い、装備して話す。蠍のナジカを倒した後にも話す"],
 ["太陽賛美","溜りの谷の太陽の祭壇（誓約「太陽の後継」の場所）"],
 ["馬鹿にする","忘却の牢のオラフィスのストレイド。懐かしい香木で石化を解く"],
 ["土下座","渡し屋ギリガン。土の塔では2000ソウル、マデューラへ移動後なら会話を尽くすと無料"],
 ["私だ！","王城ドラングレイグ入口の宰相の霊ベラガー"],
 ["命乞い","不死廟の墓守アガドゥラン。松明を灯していると敵対するので消して話す"],
 ["エイエイオー","王国隊長ドラモンド。灰の霧の核で入れる巨人の記憶の中で話す"]
];
const geKey=i=>"g"+i;
function geCnt(){let n=0;GE.forEach((_,i)=>{if(state.c[geKey(i)])n++});return [n,GE.length]}
const GR={P:"プラチナ",G:"ゴールド",S:"シルバー",B:"ブロンズ"};
const TABS=[["ch","チャート"],["tr","トロフィー"],["so","魔術"],["mi","奇跡"],["py","呪術"],["he","闇術"],["ge","ジェスチャー"],["bd","ビルド"]];
const chKey=(p,i)=>"c"+p+i;
function chCnt(){let n=0,t=0;CH.forEach(([p,,,l])=>l.forEach((_,i)=>{t++;if(state.c[chKey(p,i)])n++}));return [n,t]}
const LK="ds2-trophy-v1";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let ui={tab:"tr",hide:false,dlc:false};
try{Object.assign(ui,JSON.parse(lsGet(LK+"-ui")||"{}"))}catch(e){}
let state={c:{}};
try{const l=JSON.parse(lsGet(LK)||"{}");if(l&&l.c)state.c=l.c}catch(e){}
const storageOk=(()=>{try{const k=LK+"-t";localStorage.setItem(k,"1");localStorage.removeItem(k);return true}catch(e){return false}})();

const app=document.getElementById("app");
const allT=T.flatMap(g=>g[1]);
const spellKey=(k,i,d)=>k+(d?"d":"")+i;
function cnt(k){const s=S[k];let n=0;s.items.forEach((_,i)=>{if(state.c[spellKey(k,i)])n++});s.dlc.forEach((_,i)=>{if(state.c[spellKey(k,i,1)])n++});return [n,s.items.length+s.dlc.length]}
function tCnt(){return [allT.filter(t=>state.c[t[0]]).length,allT.length]}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function row(id,name,desc,tip,seal,extra){
  const on=!!state.c[id];
  if(ui.hide&&on)return "";
  return `<label class="row${on?" on":""}${extra||""}" for="c-${id}"><input type="checkbox" class="chk" id="c-${id}" data-id="${id}"${on?" checked":""}><div class="txt"><div class="name">${esc(name)}</div>${desc?`<div class="desc">${esc(desc)}</div>`:""}${tip?`<div class="tip">${esc(tip)}</div>`:""}</div>${seal||"<span></span>"}</label>`;
}
function render(){
  const [tn,tt]=tCnt();
  const pct=Math.round(tn/tt*100);
  let h=`<header><div class="eyebrow">DARK SOULS II ／ SCHOLAR OF THE FIRST SIN</div><h1>トロコン<span>帳</span></h1>
  <div class="meter"><div class="meter-row"><div class="meter-big">${tn}<small> / ${tt} トロフィー（${pct}%）</small></div><div class="save" id="save">${storageOk?"チェックはこのブラウザに自動保存されます":"このブラウザでは保存できません（プライベートモード等）"}</div></div><div class="bar"><i style="width:${pct}%"></i></div></div></header>`;
  h+=`<nav class="tabs" role="tablist">`+TABS.map(([k,l])=>{const c=k==="tr"?tCnt():k==="ch"?chCnt():k==="ge"?geCnt():k==="bd"?null:cnt(k);return `<button class="tab" role="tab" data-tab="${k}" aria-selected="${ui.tab===k}">${l}${c?`<b>${c[0]}/${c[1]}</b>`:""}</button>`}).join("")+`</nav>`;
  if(ui.tab!=="bd")h+=`<div class="tools"><label class="toggle"><input type="checkbox" id="hide"${ui.hide?" checked":""}>取得済みを隠す</label></div>`;
  if(ui.tab==="ch"){
    h+=`<div class="note">2周目と3周目の途中までで完了する流れです。<strong>1周目は全スペルを1キャラで集める前提</strong>なので、同じキャラで周回してください。周回の前にはセーブのバックアップを取っておくと安心です。</div>`;
    CH.forEach(([p,title,lead,list])=>{
      const n=list.filter((_,i)=>state.c[chKey(p,i)]).length;
      const rows=list.map((it,i)=>row(chKey(p,i),it[0],"",it[1],it[2]?`<span class="seal chip">${esc(it[2])}</span>`:"")).join("");
      h+=`<section class="group"><h2>${title}<span>${n}/${list.length}</span></h2><p class="lead">${esc(lead)}</p>${rows||`<div class="empty">この周回は全て完了</div>`}</section>`;
    });
  }else if(ui.tab==="ge"){
    const [n,t]=geCnt();
    h+=`<div class="note"><strong>ジェスチャーマスター</strong>：NPCなどから教わる${t}種が対象。最初から使えるジェスチャーは数に入れていません。${n===t?"全て揃いました。":`残り${t-n}種。`}覚えたジェスチャーは周回後も残ります。</div>`;
    const rows=GE.map((it,i)=>row(geKey(i),it[0],"",it[1],"")).join("");
    h+=`<section class="group"><h2>教わるジェスチャー<span>${n}/${t}</span></h2>${rows||`<div class="empty">全て取得済み</div>`}</section>`;
  }else if(ui.tab==="bd"){
    h+=BUILD;
  }else if(ui.tab==="tr"){
    T.forEach(([g,list])=>{
      const n=list.filter(t=>state.c[t[0]]).length;
      const rows=list.map(t=>row(t[0],t[2],t[3],t[4],`<span class="seal g-${t[1]}">${GR[t[1]]}</span>`)).join("");
      h+=`<section class="group"><h2>${g}<span>${n}/${list.length}</span></h2>${rows||`<div class="empty">このグループは全て取得済み</div>`}</section>`;
    });
  }else{
    const s=S[ui.tab],[n,t]=cnt(ui.tab),tr=allT.find(x=>x[0]===s.trophy);
    h+=`<div class="note"><strong>${esc(tr[2])}</strong>：${s.name} ${t}種が対象（DLCの${s.name}を含む）。${n===t?"全て揃いました。":`残り${t-n}種。`}スカラー版ではDLCが同梱されているため、DLCエリアのスペルも必要です。</div>`;
    const rows=s.items.map((it,i)=>row(spellKey(ui.tab,i),it[0],"",it[1],"",it[2]?" dlc":"")).join("")+s.dlc.map((it,i)=>row(spellKey(ui.tab,i,1),it[0],"",it[1],""," dlc")).join("");
    h+=`<section class="group"><h2>${s.name}一覧<span>${n}/${t}</span></h2>${rows||`<div class="empty">全て取得済み</div>`}</section>`;
  }
  h+=`<footer><div>入手方法は主な入手先の要約です（スカラー版基準）。四大ソウルは鍛冶屋オルニフェクスの武器交換と取り合いになるので、スペル交換を優先。ナヴァーランの依頼報酬（魔力開放・封じられた太陽）はレバーを引いて解放すると取り逃します。</div><div>出典：<a href="https://damnmodz.com/wiki/playstation-trophies/dark-souls-2/" target="_blank" rel="noopener">DS2 SotFS Trophy Guide</a>／<a href="https://www.fuzionbyte.com/dark-souls-ii-master-of-miracles-trophy-guide/" target="_blank" rel="noopener">Master of Miracles guide</a>／<a href="https://gameline.jp/darksouls2/sonota/trophy/" target="_blank" rel="noopener">ゲームライン トロフィー一覧</a>／<a href="https://seesaawiki.jp/project_dark2/d/%A5%C8%A5%ED%A5%D5%A5%A3%A1%BC" target="_blank" rel="noopener">ダークソウル2 攻略Wiki</a></div><div id="resetbox"><button class="reset" id="reset">チェックを全てリセット</button></div></footer>`;
  app.innerHTML=h;
}
function saveUi(){lsSet(LK+"-ui",JSON.stringify(ui))}
function persist(){lsSet(LK,JSON.stringify({c:state.c}))}
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.id){state.c[t.dataset.id]?delete state.c[t.dataset.id]:state.c[t.dataset.id]=1;
    const id=t.dataset.id;
    // auto-tick trophy when all base spells done
    for(const k in S){const [n,tt]=cnt(k);if(id.startsWith(k)&&n===tt)state.c[S[k].trophy]=1;}
    if(/^g\d+$/.test(id)){const [n,tt]=geCnt();if(n===tt)state.c.t15=1;}
    if(allT.filter(x=>x[0]!=="t01").every(x=>state.c[x[0]]))state.c.t01=1;
    persist();render();return;}
  if(t.id==="hide"){ui.hide=t.checked;saveUi();render()}
  
});
app.addEventListener("click",e=>{
  const tb=e.target.closest(".tab");
  if(tb){ui.tab=tb.dataset.tab;saveUi();render();return}
  if(e.target.id==="reset"){document.getElementById("resetbox").innerHTML=`<div class="confirm">本当に全てのチェックを外しますか？<button id="yes">リセットする</button><button id="no">やめる</button></div>`;return}
  if(e.target.id==="yes"){state.c={};persist();render();return}
  if(e.target.id==="no"){render();return}
});
render();
window.addEventListener("storage",e=>{if(e.key===LK){try{const l=JSON.parse(e.newValue||"{}");state.c=(l&&l.c)||{}}catch(x){state.c={}}render()}});
})();
</script>
